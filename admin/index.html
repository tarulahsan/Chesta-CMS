<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS Admin Panel</title>
    <link rel="stylesheet" href="../assets/css/admin-theme.css">
    <!-- Example: Link to Google Fonts if Nunito Sans and Roboto are used -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Core Libraries -->
    <script src="https://unpkg.com/dexie@4.0.1/dist/dexie.min.js"></script>
    <script src="https://unpkg.com/preact@10.19.2/dist/preact.umd.js"></script>
    <script src="https://unpkg.com/navigo@8.11.1/lib/navigo.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>

    <!-- TipTap v2 Libraries -->
    <script src="https://unpkg.com/@tiptap/core@2.2.4/dist/tiptap-core.umd.js"></script>
    <script src="https://unpkg.com/@tiptap/pm@2.2.4/dist/tiptap-pm.umd.js"></script> <!-- ProseMirror modules, often a dependency -->
    <script src="https://unpkg.com/@tiptap/starter-kit@2.2.4/dist/tiptap-starter-kit.umd.js"></script>
    <script src="https://unpkg.com/@tiptap/extension-link@2.2.4/dist/tiptap-extension-link.umd.js"></script>
    <script src="https://unpkg.com/@tiptap/extension-placeholder@2.2.4/dist/tiptap-extension-placeholder.umd.js"></script>
    <script src="https://unpkg.com/@tiptap/extension-text-style@2.2.4/dist/tiptap-extension-text-style.umd.js"></script>
    <!-- Note: For specific heading levels (H1-H3), StarterKit's Heading extension is configured with levels. -->

</head>
<body>
    <div id="admin-app">
        <!-- Admin SPA will be mounted here -->
    </div>
    <script type="module" src="../assets/js/admin.js"></script>
</body>
</html>
